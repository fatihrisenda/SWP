services:
  db:
    image: postgres:16-alpine
    container_name: swp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swp
      POSTGRES_PASSWORD: swp_dev_password
      POSTGRES_DB: swp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01_init_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swp -d swp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
